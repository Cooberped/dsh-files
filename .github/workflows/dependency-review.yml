name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ !github.event.repository.fork }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, SSPL-1.0
      # GitHub's dependency-diff API returns 403 for forks. Keep an equivalent
      # fail-closed supply-chain gate until this repository is ever detached.
      - name: Check out fork repository
        if: ${{ github.event.repository.fork }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.3.0 for fork audit
        if: ${{ github.event.repository.fork }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Enable pinned pnpm for fork audit
        if: ${{ github.event.repository.fork }}
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install fork lockfile without lifecycle scripts
        if: ${{ github.event.repository.fork }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce production license policy on fork
        if: ${{ github.event.repository.fork }}
        run: pnpm license:check
      - name: Reject known high-severity production vulnerabilities on fork
        if: ${{ github.event.repository.fork }}
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
