name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node20-fallback:
    name: node20-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 20.12.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.12.2
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the published JavaScript with Node 20
        run: pnpm build
      - name: Exercise the Node 20 memory-backend contract
        run: pnpm runtime:smoke

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the tested Harness Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run release gate
        run: pnpm release:check

  required-ci:
    name: required-ci
    if: always()
    needs: [node20-fallback, release-gate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI lane
        env:
          NODE20_RESULT: ${{ needs.node20-fallback.result }}
          RELEASE_RESULT: ${{ needs.release-gate.result }}
        run: |
          test "$NODE20_RESULT" = success
          test "$RELEASE_RESULT" = success
