name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require author DCO after the documented bootstrap boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LEGACY_BOUNDARY: ba6cead1b33a5bc53449918350be7618504076bf
        run: |
          start="$BASE_SHA"
          if git merge-base --is-ancestor "$BASE_SHA" "$LEGACY_BOUNDARY"; then
            start="$LEGACY_BOUNDARY"
          fi

          missing=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^<>]+>$'; then
              echo "::error::Commit $commit is missing its author Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --reverse "$start..HEAD")

          test "$missing" = 0

  node20-fallback:
    name: node20-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 20.12.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.12.2
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the published JavaScript with Node 20
        run: pnpm build
      - name: Exercise the Node 20 memory-backend contract
        run: pnpm runtime:smoke

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the tested Harness Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run release gate
        run: pnpm release:check

  required-ci:
    name: required-ci
    if: always()
    needs: [dco, node20-fallback, release-gate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          DCO_RESULT: ${{ needs.dco.result }}
          NODE20_RESULT: ${{ needs.node20-fallback.result }}
          RELEASE_RESULT: ${{ needs.release-gate.result }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DCO_RESULT" = success
          else
            test "$DCO_RESULT" = skipped
          fi
          test "$NODE20_RESULT" = success
          test "$RELEASE_RESULT" = success
