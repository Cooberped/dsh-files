changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: Breaking changes / 破坏性变更
      labels:
        - breaking-change
    - title: Security / 安全
      labels:
        - security
    - title: Features / 功能
      labels:
        - enhancement
        - feature
    - title: Fixes / 修复
      labels:
        - bug
        - fix
    - title: Documentation and community / 文档与社区
      labels:
        - documentation
        - community
    - title: Dependencies / 依赖
      labels:
        - dependencies
    - title: Other changes / 其他变更
      labels:
        - "*"
