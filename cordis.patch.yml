# dsh-upload bundle patch: one insert registering the dual-face plugin.
# `name` is the installable package name. The row id stays stable across scopes.
- insert:
    - id: files-toolkit
      name: '@cooberped/dsh-files'
      config:
        maxFileBytes: 25165824
        readLimit: 2000
        sheetRowLimit: 200
        maxSheets: 5
        cacheEntries: 16
        cacheMaxBytes: 67108864
        uploadMaxBytes: 25165824
        uploadTtlMs: 604800000
