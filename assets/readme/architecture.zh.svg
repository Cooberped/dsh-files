<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">dsh-files 架构</title>
  <desc id="desc">四层架构：从输入框上传，到本地解析与检索、带版本的模型工具，以及原生视觉分支。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6d879d"/></marker>
  </defs>
  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="72" fill="#f8fbff" font-family="Inter, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760">小体积。四层结构。一个证据闭环。</text>
  <text x="72" y="106" fill="#8fa5b8" font-family="Inter, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, ui-sans-serif, system-ui, sans-serif" font-size="17">解析与检索都留在本机；只有被选中的工具证据才进入模型上下文。</text>

  <g transform="translate(72 160)" font-family="Inter, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#f3c66b"/><text x="29" y="43" fill="#17202b" font-size="16" font-weight="800">1</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">输入框</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">文件只进来一次</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="30" fill="#d8e5ef" font-size="15">回形针多选</text>
        <rect y="60" width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="90" fill="#d8e5ef" font-size="15">文件夹 / 页面拖放</text>
        <rect y="120" width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="150" fill="#d8e5ef" font-size="15">@ 工作区候选</text>
      </g>
      <text x="24" y="305" fill="#f3c66b" font-size="13" font-weight="700">按会话隔离存储</text>
    </g>

    <g transform="translate(330)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#5bd6c3"/><text x="29" y="43" fill="#10252a" font-size="16" font-weight="800">2</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">本地摄取</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">字节决定格式</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#153039"/><text x="18" y="30" fill="#d8f1ec" font-size="15">内容嗅探</text>
        <rect y="60" width="227" height="48" rx="12" fill="#153039"/><text x="18" y="90" fill="#d8f1ec" font-size="15">有界解析器</text>
        <rect y="120" width="227" height="48" rx="12" fill="#153039"/><text x="18" y="150" fill="#d8f1ec" font-size="15">切块 + 坐标</text>
      </g>
      <text x="24" y="305" fill="#5bd6c3" font-size="13" font-weight="700">PDF · DOCX · XLSX · PPTX · TEXT</text>
    </g>

    <g transform="translate(660)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#8aa3ff"/><text x="29" y="43" fill="#162041" font-size="16" font-weight="800">3</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">私有检索</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">索引一次，只查所需</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="30" fill="#e0e7ff" font-size="15">有序中文 bigram</text>
        <rect y="60" width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="90" fill="#e0e7ff" font-size="15">SQLite FTS5 探针</text>
        <rect y="120" width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="150" fill="#e0e7ff" font-size="15">零依赖 JS 回退</text>
      </g>
      <text x="24" y="305" fill="#9eb1ff" font-size="13" font-weight="700">检索词默认不落盘</text>
    </g>

    <g transform="translate(990)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#ff8f75"/><text x="29" y="43" fill="#351a18" font-size="16" font-weight="800">4</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">模型工具</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">只给证据，不给全文</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#332325"/><text x="18" y="30" fill="#ffe8e2" font-size="15">search_documents</text>
        <rect y="60" width="227" height="48" rx="12" fill="#332325"/><text x="18" y="90" fill="#ffe8e2" font-size="15">read_document</text>
        <rect y="120" width="227" height="48" rx="12" fill="#332325"/><text x="18" y="150" fill="#ffe8e2" font-size="15">带版本坐标校验</text>
      </g>
      <text x="24" y="305" fill="#ff9c88" font-size="13" font-weight="700">截断与上限一律显式</text>
    </g>
  </g>

  <path d="M377 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M707 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1037 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(72 545)" font-family="Inter, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, ui-sans-serif, system-ui, sans-serif">
    <rect width="1265" height="106" rx="20" fill="#132234" stroke="#304b64"/>
    <rect x="24" y="24" width="92" height="58" rx="14" fill="#2c2020"/><text x="54" y="59" fill="#ff9c88" font-size="15" font-weight="700">图片</text>
    <path d="M156 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="272" y="24" width="201" height="58" rx="14" fill="#172b40"/><text x="302" y="59" fill="#d8e5ef" font-size="15">Harness 原生附件栏</text>
    <path d="M513 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="628" y="24" width="227" height="58" rx="14" fill="#172b40"/><text x="658" y="59" fill="#d8e5ef" font-size="15">供应商中立的 image_url</text>
    <path d="M895 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1011" y="24" width="230" height="58" rx="14" fill="#173529"/><text x="1041" y="59" fill="#d9f1e7" font-size="15">任何声明支持视觉的模型</text>
  </g>
</svg>
