<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">dsh-files architecture</title>
  <desc id="desc">Four-layer architecture from composer upload to local parsing and retrieval, versioned model tools, and the native vision branch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6d879d"/></marker>
  </defs>
  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="72" fill="#f8fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760">Small package. Four layers. One evidence loop.</text>
  <text x="72" y="106" fill="#8fa5b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">The plugin keeps parsing and retrieval local; only selected tool evidence enters the model context.</text>

  <g transform="translate(72 160)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#f3c66b"/><text x="29" y="43" fill="#17202b" font-size="16" font-weight="800">1</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">Composer</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">Files enter once</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="30" fill="#d8e5ef" font-size="15">Paperclip multi-select</text>
        <rect y="60" width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="90" fill="#d8e5ef" font-size="15">Folder or page drop</text>
        <rect y="120" width="227" height="48" rx="12" fill="#172b40"/><text x="18" y="150" fill="#d8e5ef" font-size="15">@ workspace mentions</text>
      </g>
      <text x="24" y="305" fill="#f3c66b" font-size="13" font-weight="700">SESSION-ISOLATED STORAGE</text>
    </g>

    <g transform="translate(330)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#5bd6c3"/><text x="29" y="43" fill="#10252a" font-size="16" font-weight="800">2</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">Local ingest</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">Bytes decide the format</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#153039"/><text x="18" y="30" fill="#d8f1ec" font-size="15">Content sniffing</text>
        <rect y="60" width="227" height="48" rx="12" fill="#153039"/><text x="18" y="90" fill="#d8f1ec" font-size="15">Bounded parsers</text>
        <rect y="120" width="227" height="48" rx="12" fill="#153039"/><text x="18" y="150" fill="#d8f1ec" font-size="15">Block + coordinate IR</text>
      </g>
      <text x="24" y="305" fill="#5bd6c3" font-size="13" font-weight="700">PDF · DOCX · XLSX · PPTX · TEXT</text>
    </g>

    <g transform="translate(660)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#8aa3ff"/><text x="29" y="43" fill="#162041" font-size="16" font-weight="800">3</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">Private retrieval</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">Index once, query narrowly</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="30" fill="#e0e7ff" font-size="15">Ordered CJK bigrams</text>
        <rect y="60" width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="90" fill="#e0e7ff" font-size="15">SQLite FTS5 probe</text>
        <rect y="120" width="227" height="48" rx="12" fill="#1d2946"/><text x="18" y="150" fill="#e0e7ff" font-size="15">Zero-dependency JS fallback</text>
      </g>
      <text x="24" y="305" fill="#9eb1ff" font-size="13" font-weight="700">QUERY LOGGING OFF BY DEFAULT</text>
    </g>

    <g transform="translate(990)">
      <rect width="275" height="330" rx="22" fill="#101f31" stroke="#34516b"/>
      <circle cx="34" cy="37" r="16" fill="#ff8f75"/><text x="29" y="43" fill="#351a18" font-size="16" font-weight="800">4</text>
      <text x="62" y="43" fill="#f4f8fb" font-size="20" font-weight="700">Model tools</text>
      <text x="24" y="89" fill="#8fa5b8" font-size="14">Evidence, not full documents</text>
      <g transform="translate(24 116)">
        <rect width="227" height="48" rx="12" fill="#332325"/><text x="18" y="30" fill="#ffe8e2" font-size="15">search_documents</text>
        <rect y="60" width="227" height="48" rx="12" fill="#332325"/><text x="18" y="90" fill="#ffe8e2" font-size="15">read_document</text>
        <rect y="120" width="227" height="48" rx="12" fill="#332325"/><text x="18" y="150" fill="#ffe8e2" font-size="15">Versioned coordinate check</text>
      </g>
      <text x="24" y="305" fill="#ff9c88" font-size="13" font-weight="700">EXPLICIT TRUNCATION + BOUNDARIES</text>
    </g>
  </g>

  <path d="M347 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M677 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1007 325h45" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(72 545)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="1265" height="106" rx="20" fill="#132234" stroke="#304b64"/>
    <rect x="24" y="24" width="118" height="58" rx="14" fill="#2c2020"/><text x="48" y="59" fill="#ff9c88" font-size="15" font-weight="700">IMAGES</text>
    <path d="M158 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="250" y="24" width="250" height="58" rx="14" fill="#172b40"/><text x="278" y="59" fill="#d8e5ef" font-size="15">Harness native attachment rail</text>
    <path d="M516 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="608" y="24" width="242" height="58" rx="14" fill="#172b40"/><text x="638" y="59" fill="#d8e5ef" font-size="15">Provider-neutral image_url</text>
    <path d="M866 53h76" stroke="#6d879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="958" y="24" width="281" height="58" rx="14" fill="#173529"/><text x="991" y="59" fill="#d9f1e7" font-size="15">Any declared vision-capable model</text>
  </g>
</svg>
